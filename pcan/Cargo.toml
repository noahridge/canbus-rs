[package]
name = "pcan"
version = "0.1.0"
edition = "2021"
description = "Safe, idiomatic Rust wrapper for the PEAK PCAN-Basic API"
license = "MIT"

[dependencies]
pcan-sys = { path = "../pcan-sys" }
can-core = { path = "../can-core" }
bitflags = "2"
thiserror = "2"
embedded-can = "0.4"
nb = "1"

[dev-dependencies]
can-core = { path = "../can-core", features = ["mock"] }
