[package]
name = "canbus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cross-platform CAN bus library with runtime-selectable backends (Kvaser, PEAK PCAN, virtual)"
documentation = "https://docs.rs/canbus"
readme = "README.md"
keywords = ["can", "canbus", "can-fd", "kvaser", "pcan"]
categories = ["hardware-support"]

[features]
default = ["kvaser", "pcan", "virtual"]
kvaser = ["dep:canbus-kvaser"]
pcan = ["dep:canbus-pcan"]
virtual = ["dep:canbus-virtual"]

[dependencies]
canbus-core.workspace = true
canbus-kvaser = { workspace = true, optional = true }
canbus-pcan = { workspace = true, optional = true }
canbus-virtual = { workspace = true, optional = true }
embedded-can.workspace = true
nb.workspace = true

[[example]]
name = "virtual_loopback"
required-features = ["virtual"]

[package.metadata.docs.rs]
all-features = true
