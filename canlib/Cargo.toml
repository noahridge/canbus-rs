[package]
name = "canlib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe, idiomatic Rust wrapper for Kvaser CANLib"

[features]
virtual-tests = []

[dependencies]
canlib-sys = { path = "../canlib-sys", version = "0.1" }
can-core = { path = "../can-core", version = "0.1" }
bitflags.workspace = true
thiserror.workspace = true
embedded-can.workspace = true
nb.workspace = true

[dev-dependencies]
can-core = { path = "../can-core", features = ["mock"] }

[[example]]
name = "virtual_loopback"
required-features = ["virtual-tests"]
