[package]
name = "canlib"
version = "0.1.0"
edition = "2021"
description = "Safe, idiomatic Rust wrapper for Kvaser CANLib"
license = "MIT"

[features]
virtual-tests = []

[dependencies]
canlib-sys = { path = "../canlib-sys" }
can-core = { path = "../can-core" }
bitflags = "2"
thiserror = "2"
embedded-can = "0.4"
nb = "1"

[dev-dependencies]
can-core = { path = "../can-core", features = ["mock"] }

[[example]]
name = "virtual_loopback"
required-features = ["virtual-tests"]
