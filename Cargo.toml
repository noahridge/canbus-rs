[workspace]
members = [
    "crates/canbus",
    "crates/canbus-core",
    "crates/canbus-kvaser",
    "crates/canbus-pcan",
    "crates/canbus-virtual",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/noahridge/canlib-rs"
rust-version = "1.85"

[workspace.dependencies]
canbus-core = { path = "crates/canbus-core", version = "0.1.0" }
canbus-kvaser = { path = "crates/canbus-kvaser", version = "0.1.0" }
canbus-pcan = { path = "crates/canbus-pcan", version = "0.1.0" }
canbus-virtual = { path = "crates/canbus-virtual", version = "0.1.0" }
bitflags = "2"
thiserror = "2"
embedded-can = "0.4"
libloading = "0.8"
nb = "1"
